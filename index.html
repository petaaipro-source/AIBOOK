<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">

<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<div class="bg" aria-hidden="true"><i class="b b1"></i><i class="b b2"></i><i class="b b3"></i></div>
<main class="box" id="box">
<div class="stk" aria-hidden="true"><svg class="ring" viewBox="0 0 100 100"><defs><path id="cp" d="M50,50 m-34,0 a34,34 0 1,1 68,0 a34,34 0 1,1 -68,0"/></defs><text><textPath href="#cp" textLength="210" lengthAdjust="spacing">spek umum 2025 ✦ akses terverifikasi ✦ </textPath></text></svg><span class="core"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0d0b14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span></div>
<h1>Login dulu, bestie.</h1><p>Sekali masuk, kamu tetap masuk. Baru keluar kalau pencet Keluar.</p>
<form id="f" autocomplete="on" novalidate>
<label for="u">Username</label><div class="f"><input id="u" name="username" placeholder="username kamu" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
<label for="p">Password</label><div class="f"><input id="p" name="password" placeholder="password rahasia" style="padding-right:50px" type="password" autocomplete="current-password"><button type="button" class="eye" id="eye" aria-label="Lihat password" title="Lihat password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<div class="sf" id="sf"><button type="button" class="av" id="cam" aria-label="Ambil selfie"><span class="in"><img id="pv" alt="Selfie kamu" hidden><span id="ph"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span></span></button><div><b id="sT">Selfie verifikasi</b><small id="sH">Foto bebas, yang penting mukamu kelihatan. Ketuk lingkaran buat mulai.</small></div></div>
<input type="file" id="file" accept="image/*" hidden>
<label class="keep" for="keep"><input type="checkbox" id="keep" checked><span class="sw"></span><span>Tetap masuk di perangkat ini</span></label>
<button id="go" type="submit">Masuk</button></form>
<div id="msg" role="alert"></div>
<button id="inst" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span>Instal Aplikasi</span></button><div id="ios" role="note"></div>
</main>
<div id="splash" role="status"><div class="wr"><div class="ring2"></div><img id="sa" alt="" hidden></div><div>Masuk otomatis...</div></div>
<div id="cs" role="dialog" aria-modal="true" aria-label="Ambil selfie"><div class="vw"><video id="vid" autoplay playsinline muted></video><div class="fl" id="fl"></div></div><div id="ce" role="alert"></div><div class="ct"><button type="button" class="tb" id="gal">Dari galeri</button><button type="button" class="sb" id="snap" aria-label="Jepret"></button><button type="button" class="tb" id="cx">Batal</button></div></div>
<script src="js/vault.js"></script>
<script src="js/auth.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
